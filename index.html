<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CYBR Training Library</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    /* Layout: app shell with header, left nav (top tabs on phones), and a content pane.
   Library = filter panel + card grid; other views are single-column work surfaces. */
    :root {
      --bg: #f3f6f3;
      --surface: #ffffff;
      --fg: #14201a;
      --muted: #596a60;
      --line: #d9e2db;
      --accent: #5fd97a;
      --accent-strong: #1c7a3a;
      --accent-soft: #dff6e5;
      --accent-ink: #0d2415;
      --warn: #8a5200;
      --warn-soft: #fcefd0;
      --danger: #b3261e;
      --danger-soft: #fde4e1;
      --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
      --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1612;
        --surface: #17211b;
        --fg: #e6efe8;
        --muted: #98a99f;
        --line: #27352c;
        --accent: #5fd97a;
        --accent-strong: #6fe08a;
        --accent-soft: #1d3a28;
        --accent-ink: #0b1d11;
        --warn: #f0b85a;
        --warn-soft: #3a2d12;
        --danger: #ff8a80;
        --danger-soft: #3d1b18;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f1612;
      --surface: #17211b;
      --fg: #e6efe8;
      --muted: #98a99f;
      --line: #27352c;
      --accent: #5fd97a;
      --accent-strong: #6fe08a;
      --accent-soft: #1d3a28;
      --accent-ink: #0b1d11;
      --warn: #f0b85a;
      --warn-soft: #3a2d12;
      --danger: #ff8a80;
      --danger-soft: #3d1b18;
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font: 400 14px/1.5 var(--f-body);
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-block: 0
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer
    }

    :focus-visible {
      outline: 2px solid var(--accent-strong);
      outline-offset: 2px
    }

    h1,
    h2,
    h3 {
      font-family: var(--f-display);
      margin: 0;
      text-wrap: balance;
      letter-spacing: -.01em
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto
    }

    /* header */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-block: 14px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px
    }

    .logo {
      font: 800 28px/1 var(--f-display);
      color: var(--accent-strong);
      letter-spacing: .02em
    }

    .brand small {
      color: var(--muted);
      font-size: 13px
    }

    .who {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted)
    }

    .who select {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 8px
    }

    .proto {
      font: 500 11px var(--f-mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      background: var(--warn-soft);
      color: var(--warn);
      padding: 3px 8px;
      border-radius: 4px
    }

    /* shell */
    .shell {
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      gap: 28px;
      padding-block: 22px 60px
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: sticky;
      top: 12px;
      align-self: start
    }

    .nav button {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: 0;
      border-radius: 6px;
      padding: 9px 10px;
      text-align: left;
      color: var(--fg);
      font-weight: 500
    }

    .nav button:hover {
      background: var(--accent-soft)
    }

    .nav button[aria-current="page"] {
      background: var(--accent);
      color: var(--accent-ink)
    }

    .nav svg {
      width: 17px;
      height: 17px;
      flex: none
    }

    .main {
      min-width: 0
    }

    @media (max-width:860px) {
      .shell {
        grid-template-columns: minmax(0, 1fr);
        gap: 16px
      }

      .nav {
        flex-direction: row;
        overflow-x: auto;
        position: static;
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px
      }

      .nav button {
        white-space: nowrap
      }
    }

    .pagehead {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px
    }

    .pagehead h1 {
      font-size: 28px;
      font-weight: 800
    }

    .pagehead p {
      margin: 4px 0 0;
      color: var(--muted);
      max-width: 60ch
    }

    /* buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 6px;
      padding: 8px 14px;
      font-weight: 500
    }

    .btn:hover {
      border-color: var(--accent-strong)
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 600
    }

    .btn.primary:hover {
      filter: brightness(.95)
    }

    .btn.danger {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger)
    }

    .btn.sm {
      padding: 4px 10px;
      font-size: 13px
    }

    .btn svg {
      width: 15px;
      height: 15px
    }

    .iconbtn {
      background: none;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 6px;
      display: inline-flex;
      color: var(--muted)
    }

    .iconbtn:hover {
      border-color: var(--line);
      color: var(--fg)
    }

    .iconbtn svg {
      width: 17px;
      height: 17px
    }

    /* library */
    .lib {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 20px;
      align-items: start
    }

    @media (max-width:1000px) {
      .lib {
        grid-template-columns: minmax(0, 1fr)
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px
    }

    .filters {
      padding: 14px 14px 6px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      position: sticky;
      top: 12px
    }

    @media (max-width:1000px) {
      .filters {
        position: static;
        max-height: none
      }

      .filters:not([open]) .fbody {
        display: none
      }
    }

    .filters summary {
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer
    }

    .filters summary::-webkit-details-marker {
      display: none
    }

    .filters h2 {
      font-size: 20px
    }

    @media (min-width:1001px) {
      .filters summary {
        pointer-events: none
      }

      .filters summary .tog {
        display: none
      }
    }

    .fgroup {
      margin-top: 14px
    }

    .fgroup h3 {
      font: 600 12px var(--f-mono);
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--accent-strong);
      margin-bottom: 6px
    }

    .fgroup h3 span {
      color: var(--muted);
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding-bottom: 4px
    }

    .opt {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      background: none;
      border: 0;
      border-radius: 5px;
      padding: 4px 8px;
      text-align: left
    }

    .opt:hover {
      background: var(--bg)
    }

    .opt[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--fg);
      font-weight: 600;
      box-shadow: inset 0 0 0 1px var(--accent-strong)
    }

    .opt i {
      font: 400 12px var(--f-mono);
      color: var(--muted);
      font-style: normal
    }

    .searchrow {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px
    }

    .search {
      flex: 1 1 240px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px
    }

    .search svg {
      width: 16px;
      height: 16px;
      color: var(--muted);
      flex: none
    }

    .search input {
      border: 0;
      background: none;
      padding: 10px 0;
      width: 100%;
      min-width: 0;
      outline: 0
    }

    .search:focus-within {
      border-color: var(--accent-strong)
    }

    .active {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
      min-height: 42px
    }

    .active b {
      font: 500 12px var(--f-mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-right: 4px
    }

    .fchip {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      background: var(--accent-soft);
      border: 1px solid var(--accent-strong);
      color: var(--fg);
      border-radius: 99px;
      padding: 2px 6px 2px 10px;
      font-size: 13px
    }

    .fchip button {
      background: none;
      border: 0;
      padding: 0 2px;
      line-height: 1;
      color: var(--muted)
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 10px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px
    }

    @media (max-width:640px) {
      .grid {
        grid-template-columns: minmax(0, 1fr)
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0
    }

    .card h3 {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.25
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px
    }

    .chip {
      font: 400 12px var(--f-mono);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 2px 7px;
      white-space: nowrap
    }

    .chip.warn {
      background: var(--warn-soft);
      border-color: transparent;
      color: var(--warn)
    }

    .chip.muted {
      opacity: .6;
      text-decoration: line-through
    }

    .chip.more {
      border-style: dashed;
      color: var(--muted)
    }

    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 6px;
      gap: 8px
    }

    .foot a {
      color: var(--accent-strong);
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      gap: 5px;
      align-items: center
    }

    .foot a:hover {
      text-decoration: underline
    }

    .foot svg {
      width: 14px;
      height: 14px
    }

    .pager {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 18px;
      flex-wrap: wrap
    }

    .pager button {
      min-width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 6px
    }

    .pager button[aria-current="page"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 600
    }

    .pager button:disabled {
      opacity: .4;
      cursor: default
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 10px
    }

    /* recommend */
    .rec {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
      gap: 20px;
      align-items: start
    }

    @media (max-width:1000px) {
      .rec {
        grid-template-columns: minmax(0, 1fr)
      }
    }

    .recform {
      padding: 16px
    }

    .recform .fgroup:first-of-type {
      margin-top: 0
    }

    .pillrow {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .pill {
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 99px;
      padding: 3px 11px;
      font-size: 13px
    }

    .pill:hover {
      border-color: var(--accent-strong)
    }

    .pill[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 600
    }

    .notice {
      background: var(--accent-soft);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 12px
    }

    .result {
      padding: 14px 16px;
      margin-bottom: 12px;
      display: grid;
      gap: 8px
    }

    .result header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start
    }

    .result h3 {
      font-size: 17px;
      font-weight: 600
    }

    .score {
      font: 600 20px var(--f-display);
      color: var(--accent-strong);
      white-space: nowrap;
      font-variant-numeric: tabular-nums
    }

    .bar {
      height: 6px;
      border-radius: 3px;
      background: var(--bg);
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--accent)
    }

    .why {
      display: flex;
      flex-wrap: wrap;
      gap: 5px
    }

    .why .chip.ok {
      background: var(--accent-soft);
      border-color: transparent
    }

    .why .chip.part {
      background: var(--warn-soft);
      border-color: transparent;
      color: var(--warn)
    }

    .why .chip.miss {
      background: var(--danger-soft);
      border-color: transparent;
      color: var(--danger)
    }

    .why .chip.nt {
      border-style: dashed;
      color: var(--muted)
    }

    .sel {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .sel input[type=checkbox] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-strong)
    }

    /* tables */
    .tablewrap {
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 560px
    }

    th {
      font: 500 12px var(--f-mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: left;
      background: var(--bg)
    }

    th,
    td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle
    }

    tr:last-child td {
      border-bottom: 0
    }

    td.act {
      white-space: nowrap;
      text-align: right;
      width: 1%
    }

    .tagline {
      color: var(--muted);
      font-size: 13px
    }

    .kind {
      font: 400 12px var(--f-mono);
      color: var(--muted)
    }

    .lock {
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--warn-soft);
      color: var(--warn);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-weight: 500
    }

    /* dashboard */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 18px
    }

    .stat {
      padding: 14px 16px
    }

    .stat b {
      display: block;
      font: 800 30px/1.1 var(--f-display);
      font-variant-numeric: tabular-nums
    }

    .stat span {
      color: var(--muted);
      font-size: 13px
    }

    .stat.flag b {
      color: var(--warn)
    }

    .cov {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 18px
    }

    .cov .panel {
      padding: 14px 16px
    }

    .cov h3 {
      font-size: 16px;
      margin-bottom: 10px
    }

    .covrow {
      display: grid;
      grid-template-columns: minmax(0, 175px) 1fr 26px;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      margin-bottom: 5px
    }

    .covrow span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .covrow b {
      font: 500 12px var(--f-mono);
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    .covrow.zero b {
      color: var(--warn)
    }

    .listrow {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line)
    }

    .listrow:last-child {
      border-bottom: 0
    }

    /* modal */
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(8, 16, 11, .55);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
      overflow-y: auto;
      z-index: 20
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      width: 100%;
      max-width: 720px;
      padding: 20px;
      margin: auto 0
    }

    .modal h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 14px
    }

    .field {
      display: grid;
      gap: 5px;
      margin-bottom: 14px;
      min-width: 0
    }

    .field>label,
    .field>.lab {
      font-weight: 600;
      font-size: 13px
    }

    .field>label small,
    .field>.lab small {
      color: var(--muted);
      font-weight: 400
    }

    .in {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px
    }

    .in:focus {
      border-color: var(--accent-strong);
      outline: 0
    }

    .two {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 16px
    }

    @media (max-width:600px) {
      .two {
        grid-template-columns: minmax(0, 1fr)
      }
    }

    .multi {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      max-height: 112px;
      overflow-y: auto;
      background: var(--bg)
    }

    .mfoot {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 6px;
      flex-wrap: wrap
    }

    .tagrow {
      display: flex;
      gap: 6px;
      margin-bottom: 6px
    }

    .err {
      color: var(--danger);
      font-size: 13px;
      margin: 0 0 10px
    }

    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      background: var(--fg);
      color: var(--bg);
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 500;
      z-index: 30;
      max-width: 90vw
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0)
    }

    @media (prefers-reduced-motion:no-preference) {

      .card,
      .result {
        transition: border-color .15s
      }

      .card:hover,
      .result:hover {

      authScreen.hidden = true;
      appShell.hidden = false;

      document.getElementById('signed-in-user').textContent =
        user.email || 'Signed in';

      const { data, error } = await cybrAuth
        .from('user_roles')
        .select('role')
        .eq('user_id', user.id)
        .single();

      if (error || !data) {
        console.error('Unable to load user role:', error);
        showLoggedOut('Your account has no assigned role. Contact an administrator.');
        return;
      }

      const role = data.role;
      authenticatedRole = role;

      document.getElementById('signed-in-user').textContent =
        `${user.email} (${role === 'admin' ? 'Administrator' : 'Trainer'})`;
      document.dispatchEvent(new Event('cybr-role-changed'));
      window.cybrSignedInUserId = user.id; // lets the app script pick this up even if it loaded after sign-in finished
      document.dispatchEvent(new CustomEvent('cybr-signed-in', { detail: { userId: user.id } }));
    }

    async function initializeAuth() {
      if (!window.supabase || SUPABASE_URL.startsWith('PASTE_') || SUPABASE_PUBLISHABLE_KEY.startsWith('PASTE_')) {
        showLoggedOut('Setup needed: enter your Supabase project URL and publishable key in the HTML file.');
        return;
      }
      cybrAuth = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      const { data, error } = await cybrAuth.auth.getUser();
      if (error || !data.user) showLoggedOut();
      else showLoggedIn(data.user);
      cybrAuth.auth.onAuthStateChange((_event, session) => {
        if (!session) showLoggedOut();
        else showLoggedIn(session.user);
      });
    }
    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (!cybrAuth) return;
      const button = document.getElementById('login-button');
      button.disabled = true;
      loginError.textContent = '';
      try {
        const { error } = await cybrAuth.auth.signInWithPassword({
          email: document.getElementById('login-email').value.trim(),
          password: document.getElementById('login-password').value
        });
        if (error) loginError.textContent = error.message;
        else document.getElementById('login-password').value = '';
      } catch (error) { loginError.textContent = 'Could not connect. Check your settings and internet connection.'; }
      finally { button.disabled = false; }
    });
    document.getElementById('logout-button').addEventListener('click', async () => {
      if (!cybrAuth) return;
      const { error } = await cybrAuth.auth.signOut();
      if (error) alert('Logout failed: ' + error.message);

      async function loadData() {

          db.from('categories').select('id,name,multi,description,sort_order').order('sort_order'),
          db.from('tags').select('id,category_id,name,hint,sort_order').order('sort_order'),

        var removed = oldIds.filter(function (x) { return newIds.indexOf(x) < 0 }), added = newIds.filter(function (x) { return oldIds.indexOf(x) < 0 });
        if (removed.length) { var d = await cybrAuth.from('material_tags').delete().eq('material_id', id).in('tag_id', removed); if (d.error) throw d.error }

      async function dbUpdateCategory(c, name, multi, rows, desc) {

        var keep = {}; rows.forEach(function (r) { if (r.orig) keep[r.orig] = 1 });

        if (removed.length) { var d = await db.from('tags').delete().in('id', removed); if (d.error) throw d.error }
        var existing = rows.filter(function (r) { return r.orig }).map(function (r, i) { return { id: st.tagIds[cid + '|' + r.orig], category_id: cid, name: r.name, hint: r.hint || '', sort_order: rows.indexOf(r), renamed: r.orig !== r.name } });

        if (renamed.length > 1) { // two-step rename so swaps and chains (A to B, B to C) never clash on the unique name
          var tmp = await db.from('tags').upsert(renamed.map(function (x) { return { id: x.id, category_id: cid, name: '~' + x.id, hint: x.hint, sort_order: x.sort_order } })); if (tmp.error) throw tmp.error;

        var af = activeFilters();

        var pages = Math.max(1, Math.ceil(list.length / PER));
        if (st.page > pages) st.page = pages;
        var slice = list.slice((st.page - 1) * PER, st.page * PER);
        var h = '<div class="pagehead"><div><h1>Training Materials</h1><p>Search by keyword or narrow by tag. Files stay in CYBR\'s Google Drive; this library stores the link and the tags.</p></div>';
        if (isAdmin()) h += '<button class="btn primary" data-act="addmat">' + ic('plus') + 'Add material</button>';
        h += '</div><div class="lib"><details class="panel filters" id="fdet" open><summary><h2>Filters</h2><span class="tog btn sm">Show / hide</span></summary><div class="fbody">';
        st.cats.forEach(function (c) {
          h += '<div class="fgroup"><h3>' + esc(c.name) + '</h3>' + helpHtml(c) + '<div class="opts">';
          c.tags.forEach(function (t) {
            var on = (st.filters[c.id] || []).indexOf(t) > -1, hn = hintOf(c, t);
            h += '<button class="opt"' + (hn ? ' title="' + esc(hn) + '"' : '') + ' aria-pressed="' + on + '" data-act="ftoggle" data-c="' + c.id + '" data-t="' + esc(t) + '"><span>' + esc(t) + '</span><i>' + tagCount(c.id, t) + '</i></button>';
          });
          h += '</div></div>';
        });
        h += '</div></details><div><div class="searchrow"><label class="search" for="q">' + ic('search') + '<span class="sr">Search materials</span><input id="q" type="search" placeholder="Search titles, descriptions and tags" value="' + esc(st.q) + '" autocomplete="off"></label></div>';

        if (!af.length && !st.q) h += '<span class="tagline">None. Showing every material.</span>';
        af.forEach(function (f) { h += '<span class="fchip">' + esc(f.c.name) + ': ' + esc(f.t) + '<button data-act="ftoggle" data-c="' + f.c.id + '" data-t="' + esc(f.t) + '" aria-label="Remove ' + esc(f.t) + '">' + ic('x').replace('<svg', '<svg width="12" height="12"') + '</button></span>' });
        if (af.length || st.q) h += '<button class="btn danger sm" data-act="clear" style="margin-left:auto">Remove filters</button>';
        h += '</div><p class="count">' + list.length + ' of ' + st.items.length + ' materials</p>';
        if (!slice.length) h += '<div class="empty">No materials match these filters. Remove a filter or search for fewer words.</div>';
        else h += '<div class="grid">' + slice.map(cardHtml).join('') + '</div>';
        if (pages > 1) {

          for (var p = 1; p <= pages; p++)h += '<button data-act="page" data-p="' + p + '"' + (p === st.page ? ' aria-current="page"' : '') + '>' + p + '</button>';
          h += '<button data-act="page" data-p="' + (st.page + 1) + '"' + (st.page === pages ? ' disabled' : '') + ' aria-label="Next page">&gt;</button></div>';

      }

      /* recommender */
      var NO_REC = { rtype: 1, recency: 1, threat: 1 };
      var WT = { topic: 3, audience: 2, industry: 2, level: 2, length: 2, delivery: 2, group: 1, maturity: 1, equip: 1, juris: .5 };
      var ORD = { length: 1, group: 1, level: 1, maturity: 1 };
      function scoreItem(it) {
        var tot = 0, got = 0, why = [];
        st.cats.forEach(function (c) {
          if (NO_REC[c.id]) return;
          var want = st.rec[c.id] || []; if (!want.length) return;
          var have = it.tags[c.id] || [], w = WT[c.id] || 1, s, kind, label;
          tot += w;
          if (!have.length) { s = .5; kind = 'nt'; label = c.name + ': not tagged' }
          else if (c.id === 'equip') {
            var miss = have.filter(function (t) { return want.indexOf(t) < 0 && t !== 'No equipment required' });
            s = miss.length ? 0 : 1; kind = s ? 'ok' : 'miss'; label = s ? 'Equipment OK' : 'Needs ' + miss.join(', ');
          } else if (!c.multi) {
            var wt = want[0], ht = have[0];
            if (wt === ht) { s = 1; kind = 'ok'; label = ht }
            else if (ORD[c.id] && Math.abs(c.tags.indexOf(wt) - c.tags.indexOf(ht)) === 1) { s = .4; kind = 'part'; label = c.name + ': ' + ht }
            else { s = 0; kind = 'miss'; label = c.name + ': ' + ht }
          } else {
            var inter = want.filter(function (t) { return have.indexOf(t) > -1 });
            s = inter.length / want.length;
            if (s === 1) { kind = 'ok'; label = inter.join(', ') }
            else if (s > 0) { kind = 'part'; label = inter.join(', ') + ' (of ' + want.length + ')' }
            else { kind = 'miss'; label = c.name + ': ' + have.join(', ') }
          }
          got += w * s; why.push({ k: kind, l: label });
        });
        return { it: it, score: tot ? got / tot : 0, why: why, tot: tot };
      }
      function viewRecommend() {
        var h = '<div class="pagehead"><div><h1>Find for a Session</h1><p>Describe the upcoming session and get a ranked shortlist. Pick as many or as few details as you know.</p></div></div><div class="rec"><section class="panel recform" aria-label="Session details">';
        st.cats.forEach(function (c) {
          if (NO_REC[c.id]) return;
          var want = st.rec[c.id] || [];
          var lab = c.id === 'equip' ? 'Equipment available' : c.name;
          h += '<div class="fgroup"><h3>' + esc(lab) + ' <span>' + (c.multi ? 'choose any' : 'choose one') + '</span></h3>' + helpHtml(c) + '<div class="pillrow">';
          c.tags.forEach(function (t) { var hn = hintOf(c, t); h += '<button class="pill"' + (hn ? ' title="' + esc(hn) + '"' : '') + ' aria-pressed="' + (want.indexOf(t) > -1) + '" data-act="rtoggle" data-c="' + c.id + '" data-t="' + esc(t) + '">' + esc(t) + '</button>' });
          h += '</div></div>';
        });
        h += '<div class="fgroup sel"><input type="checkbox" id="rarch"' + (st.recArchived ? ' checked' : '') + '><label for="rarch">Include archived materials</label></div>';
        h += '<div class="mfoot"><button class="btn" data-act="rreset">Clear session details</button></div></section><section aria-label="Shortlist">';
        var res = st.items.filter(function (it) { return st.recArchived || (it.tags.recency || [])[0] !== 'Archived' }).map(scoreItem);
        var any = Object.keys(st.rec).some(function (k) { return (st.rec[k] || []).length && !NO_REC[k] });
        h += '<div class="notice"><b>A starting point, not a decision.</b> Scores show how closely each material\'s tags fit the session. Untagged fields count as neutral so thinly tagged materials are not pushed out. Review each one before you use it.</div>';
        if (!any) h += '<div class="empty">Choose at least one session detail to see a shortlist.</div>';
        else {
          res.sort(function (a, b) { return b.score - a.score || a.it.title.localeCompare(b.it.title) });
          res.slice(0, 8).forEach(function (r) {
            var pct = Math.round(r.score * 100);
            var tier = pct >= 80 ? 'Strong match' : pct >= 55 ? 'Partial match' : 'Weak match';
            var rc = (r.it.tags.recency || [])[0];
            h += '<article class="panel result"><header><div><h3>' + esc(r.it.title) + '</h3><span class="tagline">' + tier + (r.it.sample ? ' · sample' : '') + (rc === 'Needs review' ? ' · tagged "Needs review"' : rc === 'Archived' ? ' · archived' : '') + '</span></div><span class="score">' + pct + '%</span></header>';
            h += '<div class="bar" role="img" aria-label="' + pct + ' percent match"><i style="width:' + pct + '%"></i></div><div class="why">' + r.why.map(function (w) { return '<span class="chip ' + w.k + '">' + esc(w.l) + '</span>' }).join('') + '</div>';
            h += '<div class="foot">' + linkHtml(r.it) + '</div></article>';
          });
        }
        return h + '</section></div>';
      }

      }

      async function saveMat() {

        var id = st.modal.id, it = id ? st.items.filter(function (x) { return x.id === id })[0] : null;
        var tags = {};
        st.cats.forEach(function (c) {
          if (c.multi) {

          else { var nid = await dbAddMaterial(fields, tagIdsOf(tags)); st.items.unshift({ id: nid, title: fields.title, desc: fields.desc, link: fields.link, sample: false, tags: tags }) }

      async function saveCat() {
        if (!isAdmin()) return drawCatModal('Only administrators can change tags and categories.');
        readCatDraft();
        var name = catDraft.name.trim();
        if (!name) return drawCatModal('Enter a category name.');
        var rows = catDraft.rows.map(function (r) { return { orig: r.orig, name: r.name.trim(), hint: (r.hint || '').trim() } }).filter(function (r) { return r.name });
        var desc = catDraft.desc.trim();
        var seen = {}, dup = false; rows.forEach(function (r) { var k = r.name.toLowerCase(); if (seen[k]) dup = true; seen[k] = 1 });
        if (dup) return drawCatModal('Two tags have the same name. Rename or remove one.');
        if (!rows.length) return drawCatModal('Add at least one tag.');
        var id = st.modal.id, c = id ? cat(id) : null;
        var btn = document.querySelector('#catform button[type="submit"]');
        if (btn) { btn.disabled = true; btn.textContent = 'Saving…' }
        try {
          if (!c) {
            var base = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'cat', nid = base, k = 1;
            while (cat(nid)) nid = base + '-' + (++k);
            await dbCreateCategory({ id: nid, name: name, multi: catDraft.multi, desc: desc }, rows);
          } else {
            var map = {}; rows.forEach(function (r) { if (r.orig) map[r.orig] = r.name });
            await dbUpdateCategory(c, name, catDraft.multi, rows, desc);
            if (st.filters[c.id]) st.filters[c.id] = st.filters[c.id].filter(function (t) { return map[t] !== undefined }).map(function (t) { return map[t] });
            if (st.rec[c.id]) st.rec[c.id] = st.rec[c.id].filter(function (t) { return map[t] !== undefined }).map(function (t) { return map[t] });
          }
          await loadData(); // re-read from the server so the screen always matches what was saved
        } catch (e) {
          console.error('Category save failed:', e);
          try { await loadData() } catch (x) { }
          return drawCatModal('Could not save. ' + errMsg(e) + ' Close this window and reopen the category to see what was saved.');
        }
        closeModal(); render(); toast('Category saved');
      }
      async function delCat(id) {
        if (!isAdmin()) { toast('Only administrators can delete categories.'); return }
        try { await dbDeleteCategory(id); await loadData() }
        catch (e) { console.error('Delete failed:', e); toast('Could not delete. ' + errMsg(e)); return }
        delete st.filters[id]; delete st.rec[id]; st.confirmDel = null; render(); toast('Category deleted');
      }

      /* ---------- events ---------- */
      function toggleIn(map, cid, t, multi) {
        var a = map[cid] || [];
        var i = a.indexOf(t);
        if (i > -1) a = a.filter(function (x) { return x !== t });
        else a = multi ? a.concat([t]) : [t];
        map[cid] = a;
      }
      document.addEventListener('click', function (e) {
        var el = e.target.closest('[data-act]');
        if (!el) { return }
        var act = el.getAttribute('data-act');
        var c = el.getAttribute('data-c'), t = el.getAttribute('data-t'), id = el.getAttribute('data-id');
        if (act === 'scrim') { if (e.target === el) closeModal(); return }
        if (ADMIN_ACTS.indexOf(act) > -1 && !isAdmin()) { toast('Only administrators can do that.'); return }
        switch (act) {
          case 'view': st.view = el.getAttribute('data-v'); st.confirmDel = null; render(); window.scrollTo(0, 0); break;
          case 'ftoggle': toggleIn(st.filters, c, t, true); st.page = 1; render(); break;
          case 'clear': st.filters = {}; st.q = ''; st.page = 1; render(); break;
          case 'page': st.page = +el.getAttribute('data-p'); render(); window.scrollTo(0, 0); break;
          case 'rtoggle': var cc = cat(c); toggleIn(st.rec, c, t, cc.multi); render(); break;
          case 'rreset': st.rec = {}; render(); break;
          case 'addmat': matModal(null); break;
          case 'editmat': matModal(id); break;
          case 'mpill': el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); break;
          case 'delmat':
            if (el.getAttribute('data-sure')) { deleteMat(el) }
            else { el.setAttribute('data-sure', '1'); el.textContent = 'Click again to delete' }
            break;
          case 'retry': st.loadError = ''; render(); refreshData(st.pendingUser); break;
          case 'closemodal': closeModal(); break;
          case 'addcat': catModal(null); break;
          case 'editcat': catModal(id); break;
          case 'askdel': st.confirmDel = id; render(); break;
          case 'cancelcat': st.confirmDel = null; render(); break;
          case 'delcat':
            delCat(id); break;
          case 'addrow': readCatDraft(); catDraft.rows.push({ orig: '', name: '', hint: '' }); drawCatModal(); var rs = document.querySelectorAll('#modal [data-row]'); rs[rs.length - 1].focus(); break;
          case 'rmrow': readCatDraft(); catDraft.rows.splice(+el.getAttribute('data-i'), 1); drawCatModal(); break;
        }
      });
      document.addEventListener('input', function (e) {
        if (e.target.id === 'q') { st.q = e.target.value; st.page = 1; render() }
      });
      document.addEventListener('change', function (e) {
        if (e.target.id === 'rarch') { st.recArchived = e.target.checked; render() }
      });
      document.addEventListener('submit', function (e) {
        e.preventDefault();
        if (e.target.id === 'matform') saveMat();
        if (e.target.id === 'catform') saveCat();
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && st.modal) closeModal() });

      document.addEventListener('cybr-role-changed', function () { closeModal(); render(); });
      document.addEventListener('cybr-signed-in', function (e) {
        var uid = e.detail.userId; st.pendingUser = uid;
        if (st.loaded && st.userId === uid) return; // token refresh: keep what is on screen
        refreshData(uid);
      });
      document.addEventListener('cybr-signed-out', function () { st.cats = []; st.items = []; st.tagIds = {}; st.loaded = false; st.userId = null; st.loadError = ''; st.filters = {}; st.q = ''; render(); });
      render();
      if (window.cybrSignedInUserId) { st.pendingUser = window.cybrSignedInUserId; refreshData(window.cybrSignedInUserId) }
    })();
  </script>

</body>

</html>
